{% extends 'base.html' %}
{% block title %}Share Parenting Tip – MY PINCOD{% endblock %}
{% block content %}
<style>
  nav.navbar{display:none!important}
  body{background:#f0fdf4}
  #ptpTopBar{position:sticky;top:0;z-index:200;background:#fff;border-bottom:1px solid #bbf7d0;padding:12px 16px;display:flex;align-items:center;gap:10px}
  #ptpTopBar a{color:#374151;text-decoration:none;font-size:20px}
  #ptpTopBar h2{font-size:15px;font-weight:900;color:#111;margin:0;flex:1}
  .ptp-form{padding:16px 16px 100px;max-width:600px;margin:0 auto}
  .form-card{background:#fff;border-radius:16px;padding:20px;border:1.5px solid #d1fae5;margin-bottom:14px}
  .form-card h3{font-size:11px;font-weight:800;color:#047857;text-transform:uppercase;letter-spacing:.06em;margin:0 0 14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:5px}
  .field input,.field textarea{width:100%;padding:11px 13px;border:1.5px solid #d1fae5;border-radius:10px;font-size:14px;box-sizing:border-box;outline:none;font-family:inherit;background:#f0fdf4}
  .field input:focus,.field textarea:focus{border-color:#059669;background:#fff}
  .field textarea{min-height:100px;resize:vertical}

  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .cat-opt{position:relative}
  .cat-opt input[type=radio]{position:absolute;opacity:0;width:0;height:0}
  .cat-opt label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1.5px solid #d1fae5;cursor:pointer;font-size:10px;font-weight:700;color:#065f46;text-align:center;line-height:1.2;transition:all .15s;background:#f0fdf4}
  .cat-opt label .icon{font-size:22px}
  .cat-opt input:checked + label{border-color:#059669;background:#d1fae5;color:#047857}

  .img-upload{width:100%;height:110px;border:2px dashed #bbf7d0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:#f0fdf4;position:relative;overflow:hidden;transition:border-color .15s}
  .img-upload:hover{border-color:#059669}
  .img-upload span{font-size:12px;color:#059669;position:relative}
  .img-upload .preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,#059669,#10b981);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit}
</style>

<div id="ptpTopBar">
  <a href="/community/parenting/">&#8592;</a>
  <h2>💡 Share a Parenting Tip</h2>
</div>

<div class="ptp-form">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-card">
      <h3>Category</h3>
      <div class="cat-grid">
        <div class="cat-opt"><input type="radio" name="category" id="cat_tips" value="tips" checked><label for="cat_tips"><span class="icon">💡</span>Tips</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_activity" value="activity"><label for="cat_activity"><span class="icon">🎯</span>Activity</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_health" value="health"><label for="cat_health"><span class="icon">🏥</span>Health</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_education" value="education"><label for="cat_education"><span class="icon">📚</span>Education</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_food" value="food"><label for="cat_food"><span class="icon">🥗</span>Food</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_emotion" value="emotion"><label for="cat_emotion"><span class="icon">💛</span>Emotional</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_other" value="other"><label for="cat_other"><span class="icon">👨‍👩‍👧</span>Other</label></div>
      </div>
    </div>

    <div class="form-card">
      <h3>Your Tip or Story</h3>
      <div class="field">
        <label>Title *</label>
        <input type="text" name="title" placeholder="e.g. How we made screen time fun & educational" required>
      </div>
      <div class="field">
        <label>Details *</label>
        <textarea name="content" placeholder="Share your experience, what worked, advice for other parents..." required></textarea>
      </div>
    </div>

    <div class="form-card">
      <h3>Photo (optional)</h3>
      <div class="img-upload" onclick="document.getElementById('ptImg').click()">
        <span style="font-size:2rem">📷</span>
        <span>Tap to add a photo</span>
        <input type="file" id="ptImg" name="image" accept="image/*" style="display:none" onchange="previewImg(this)">
      </div>
    </div>

    <button type="submit" class="submit-btn">Share with Parents 👨‍👩‍👧</button>
  </form>
</div>

<script>
function previewImg(input){
  if(input.files&&input.files[0]){
    var r=new FileReader();
    r.onload=function(e){
      var box=input.closest('.img-upload');
      var img=box.querySelector('.preview')||document.createElement('img');
      img.className='preview';img.src=e.target.result;
      box.appendChild(img);
      box.querySelectorAll('span').forEach(function(s){s.style.display='none'});
    };
    r.readAsDataURL(input.files[0]);
  }
}
</script>
{% endblock %}
