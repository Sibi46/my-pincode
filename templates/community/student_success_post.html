{% extends 'base.html' %}
{% block title %}Share Achievement – OUR PINCODE{% endblock %}
{% block content %}
<style>
  nav.navbar{display:none!important}
  body{background:#f4f6f9}
  #sspTopBar{position:sticky;top:0;z-index:200;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 16px;display:flex;align-items:center;gap:10px}
  #sspTopBar a{color:#374151;text-decoration:none;font-size:20px}
  #sspTopBar h2{font-size:15px;font-weight:900;color:#111;margin:0;flex:1}

  .ssp-form{padding:16px 16px 100px;max-width:600px;margin:0 auto}
  .form-card{background:#fff;border-radius:16px;padding:20px;border:1.5px solid #e5e7eb;margin-bottom:14px}
  .form-card h3{font-size:11px;font-weight:800;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin:0 0 14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:5px}
  .field input,.field textarea,.field select{width:100%;padding:11px 13px;border:1.5px solid #d1d5db;border-radius:10px;font-size:14px;box-sizing:border-box;outline:none;font-family:inherit}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:#7c3aed}
  .field textarea{min-height:90px;resize:vertical}
  .field-row{display:flex;gap:10px}
  .field-row .field{flex:1;min-width:0}

  /* category grid */
  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .cat-opt{position:relative}
  .cat-opt input[type=radio]{position:absolute;opacity:0;width:0;height:0}
  .cat-opt label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px;border-radius:12px;border:1.5px solid #e5e7eb;cursor:pointer;font-size:10px;font-weight:700;color:#374151;text-align:center;line-height:1.2;transition:all .15s}
  .cat-opt label .icon{font-size:22px}
  .cat-opt input:checked + label{border-color:#7c3aed;background:#ede9fe;color:#7c3aed}

  .img-upload{width:100%;height:110px;border:2px dashed #d1d5db;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:#f9fafb;position:relative;overflow:hidden;transition:border-color .15s}
  .img-upload:hover{border-color:#7c3aed}
  .img-upload span{font-size:12px;color:#9ca3af;position:relative}
  .img-upload .preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit}
</style>

<div id="sspTopBar">
  <a href="/community/student-success/">&#8592;</a>
  <h2>🏅 Share Achievement</h2>
</div>

<div class="ssp-form">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-card">
      <h3>Category</h3>
      <div class="cat-grid">
        <div class="cat-opt"><input type="radio" name="category" id="cat_academics" value="academics" checked><label for="cat_academics"><span class="icon">📚</span>Academics</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_sports" value="sports"><label for="cat_sports"><span class="icon">⚽</span>Sports</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_arts" value="arts"><label for="cat_arts"><span class="icon">🎨</span>Arts</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_music" value="music"><label for="cat_music"><span class="icon">🎵</span>Music</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_scholarship" value="scholarship"><label for="cat_scholarship"><span class="icon">🏅</span>Scholarship</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_competition" value="competition"><label for="cat_competition"><span class="icon">🏆</span>Competition</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_other" value="other"><label for="cat_other"><span class="icon">🎓</span>Other</label></div>
      </div>
    </div>

    <div class="form-card">
      <h3>Student Info</h3>
      <div class="field">
        <label>Student Name *</label>
        <input type="text" name="student_name" placeholder="e.g. Arjun Kumar" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label>School / College</label>
          <input type="text" name="school_name" placeholder="School name">
        </div>
        <div class="field">
          <label>Grade / Class</label>
          <input type="text" name="grade" placeholder="e.g. Class 10">
        </div>
      </div>
    </div>

    <div class="form-card">
      <h3>Achievement</h3>
      <div class="field">
        <label>Title *</label>
        <input type="text" name="title" placeholder="e.g. State Rank 1 in Science Olympiad!" required>
      </div>
      <div class="field">
        <label>Tell the Story *</label>
        <textarea name="content" placeholder="Share the journey, the effort, and the achievement..." required></textarea>
      </div>
    </div>

    <div class="form-card">
      <h3>Photo (optional)</h3>
      <div class="img-upload" onclick="document.getElementById('ssImg').click()">
        <span style="font-size:2rem">🏅</span>
        <span>Tap to add a photo</span>
        <input type="file" id="ssImg" name="image" accept="image/*" style="display:none" onchange="previewImg(this)">
      </div>
    </div>

    <button type="submit" class="submit-btn">Share Achievement 🎓</button>
  </form>
</div>

<script>
function previewImg(input){
  if(input.files&&input.files[0]){
    var r=new FileReader();
    r.onload=function(e){
      var box=input.closest('.img-upload');
      var img=box.querySelector('.preview')||document.createElement('img');
      img.className='preview';img.src=e.target.result;
      box.appendChild(img);
      box.querySelectorAll('span').forEach(function(s){s.style.display='none'});
    };
    r.readAsDataURL(input.files[0]);
  }
}
</script>
{% endblock %}
