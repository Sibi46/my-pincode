{% extends 'base.html' %}
{% block title %}Post Volunteer Activity – MY PINCOD{% endblock %}
{% block content %}
<style>
  nav.navbar{display:none!important}
  body{background:#f0fdf4}
  #volpTopBar{position:sticky;top:0;z-index:200;background:#fff;border-bottom:1px solid #bbf7d0;padding:12px 16px;display:flex;align-items:center;gap:10px}
  #volpTopBar a{color:#374151;text-decoration:none;font-size:20px}
  #volpTopBar h2{font-size:15px;font-weight:900;color:#111;margin:0;flex:1}
  .volp-form{padding:16px 16px 100px;max-width:600px;margin:0 auto}
  .form-card{background:#fff;border-radius:16px;padding:20px;border:1.5px solid #bbf7d0;margin-bottom:14px}
  .form-card h3{font-size:11px;font-weight:800;color:#16a34a;text-transform:uppercase;letter-spacing:.06em;margin:0 0 14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:5px}
  .field input,.field textarea{width:100%;padding:11px 13px;border:1.5px solid #bbf7d0;border-radius:10px;font-size:14px;box-sizing:border-box;outline:none;font-family:inherit;background:#f0fdf4}
  .field input:focus,.field textarea:focus{border-color:#16a34a;background:#fff}
  .field textarea{min-height:90px;resize:vertical}
  .field-row{display:flex;gap:10px}
  .field-row .field{flex:1;min-width:0}

  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .cat-opt{position:relative}
  .cat-opt input[type=radio]{position:absolute;opacity:0;width:0;height:0}
  .cat-opt label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1.5px solid #bbf7d0;cursor:pointer;font-size:10px;font-weight:700;color:#14532d;text-align:center;line-height:1.2;transition:all .15s;background:#f0fdf4}
  .cat-opt label .icon{font-size:22px}
  .cat-opt input:checked + label{border-color:#16a34a;background:#dcfce7;color:#15803d}

  .img-upload{width:100%;height:110px;border:2px dashed #bbf7d0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:#f0fdf4;position:relative;overflow:hidden;transition:border-color .15s}
  .img-upload:hover{border-color:#16a34a}
  .img-upload span{font-size:12px;color:#16a34a;position:relative}
  .img-upload .preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit}
</style>

<div id="volpTopBar">
  <a href="/community/volunteer/">&#8592;</a>
  <h2>🤝 Post Volunteer Activity</h2>
</div>

<div class="volp-form">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-card">
      <h3>Activity Type</h3>
      <div class="cat-grid">
        <div class="cat-opt"><input type="radio" name="category" id="cat_blood" value="blood" checked><label for="cat_blood"><span class="icon">🩸</span>Blood</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_tree" value="tree"><label for="cat_tree"><span class="icon">🌳</span>Trees</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_health" value="health"><label for="cat_health"><span class="icon">🏥</span>Health</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_edu" value="education"><label for="cat_edu"><span class="icon">📚</span>Education</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_cleanup" value="cleanup"><label for="cat_cleanup"><span class="icon">🧹</span>Cleanup</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_food" value="food"><label for="cat_food"><span class="icon">🍱</span>Food</label></div>
        <div class="cat-opt"><input type="radio" name="category" id="cat_other" value="other"><label for="cat_other"><span class="icon">🤝</span>Other</label></div>
      </div>
    </div>

    <div class="form-card">
      <h3>Activity Details</h3>
      <div class="field">
        <label>Title *</label>
        <input type="text" name="title" placeholder="e.g. Blood Donation Camp at Anna Nagar" required>
      </div>
      <div class="field">
        <label>Description *</label>
        <textarea name="description" placeholder="What will happen, who can join, what to bring, requirements..." required></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Volunteers Needed</label>
          <input type="number" name="volunteers_needed" placeholder="50" min="0">
        </div>
        <div class="field">
          <label>Contact</label>
          <input type="text" name="contact" placeholder="Phone / Name">
        </div>
      </div>
    </div>

    <div class="form-card">
      <h3>Date & Venue</h3>
      <div class="field-row">
        <div class="field">
          <label>Date *</label>
          <input type="date" name="activity_date" min="{{ today }}" required>
        </div>
        <div class="field">
          <label>Time</label>
          <input type="time" name="activity_time">
        </div>
      </div>
      <div class="field">
        <label>Venue *</label>
        <input type="text" name="venue" placeholder="e.g. Government Hospital, T. Nagar" required>
      </div>
    </div>

    <div class="form-card">
      <h3>Photo (optional)</h3>
      <div class="img-upload" onclick="document.getElementById('volImg').click()">
        <span style="font-size:2rem">📷</span>
        <span>Add a photo or poster</span>
        <input type="file" id="volImg" name="image" accept="image/*" style="display:none" onchange="previewImg(this)">
      </div>
    </div>

    <button type="submit" class="submit-btn">Post Activity 🤝</button>
  </form>
</div>

<script>
function previewImg(input){
  if(input.files&&input.files[0]){
    var r=new FileReader();
    r.onload=function(e){
      var box=input.closest('.img-upload');
      var img=box.querySelector('.preview')||document.createElement('img');
      img.className='preview';img.src=e.target.result;
      box.appendChild(img);
      box.querySelectorAll('span').forEach(function(s){s.style.display='none'});
    };
    r.readAsDataURL(input.files[0]);
  }
}
</script>
{% endblock %}
